# Pi-only config. nginx runs with host networking (podman-compose.pi.yml) so
# it can reach host-local services (Glances, the Pi 4B backend's published
# port) on 127.0.0.1. Dev container mode uses default.dev.conf instead.
#
# It listens on the loopback only. The pi4 front door (a Caddy in the
# pi-scripts repo, pi4/front-door/) owns the public :80/:443 and proxies
# http://meals.local/ (and the old http://pi4/ paths) to 127.0.0.1:8080.
# The real_ip lines below restore the client address from Caddy's
# X-Forwarded-For, so $remote_addr in logs and the backend's X-Real-IP is the
# household device again, not 127.0.0.1. Host networking was originally
# chosen for exactly that (rootless Podman's published-port proxy hid it).

upstream backend_cluster {
    least_conn;
    server 172.19.181.1:3001 max_fails=2 fail_timeout=60s;
    server 172.19.181.2:3001 max_fails=2 fail_timeout=60s;
    server 172.19.181.3:3001 max_fails=2 fail_timeout=60s;
    server 172.19.181.4:3001 max_fails=2 fail_timeout=60s;
    keepalive 8;
}

server {
    listen 127.0.0.1:8080;
    server_name mealplanner;
    root /usr/share/nginx/html;

    # Trust X-Forwarded-For only from the front door on the loopback.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    # Security headers - Enhanced for production security
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS filter in browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restrict browser features and APIs
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Content Security Policy - Prevents XSS and injection attacks
    # Production-hardened: removed 'unsafe-eval', tightened connect-src
    # Note: 'unsafe-inline' still required for React runtime styles
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

    # HSTS - Force HTTPS for 1 year (only applies when served over HTTPS)
    # Safe for mixed HTTP/HTTPS deployments - browsers ignore on HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Remove server version information
    server_tokens off;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Static image files - Enhanced caching for P1 Issue #167
    location /images/ {
        alias /usr/share/nginx/html/images/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;

        # Enable gzip for SVG images
        gzip_static on;
    }

    # Static assets with versioned filenames (hashed)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;

        # Enable gzip
        gzip_static on;
    }

    # Glances monitoring dashboard (scripts/install-glances.sh).
    # Glances runs on the Pi 4B host, bound to the ClusterHAT bridge IP — reachable
    # from nginx (host or container networking), not from the LAN.
    # Glances 3.x has no --url-prefix, so the trailing slash on proxy_pass strips
    # /monitoring/. Access control is Glances' own --password (HTTP basic auth,
    # passed through).
    location = /monitoring {
        return 301 /monitoring/;
    }
    location /monitoring/ {
        proxy_pass http://172.19.181.254:61208/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30;
        access_log off;
    }

    # API routes - load balanced across Zero W cluster with Pi 4B fallback
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 90;

        # Disable caching for API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # Fall back to Pi 4B local backend when all Zero Ws are unreachable
        error_page 502 503 504 = @backend_local;
    }

    # Pi 4B local backend fallback — the backend container publishes 3000 on
    # the host's loopback only (podman-compose.pi.yml). A fixed address, so no
    # resolver needed and no stale-DNS risk after container restarts (#286).
    location @backend_local {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 90;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Serve pre-built React PWA static files directly (no frontend container on Pi)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

